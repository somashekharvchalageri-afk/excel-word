<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to Clean Text Converter</title>
    <!-- SheetJS Library for parsing Excel files natively in the browser -->
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .drop-zone {
            border: 2px dashed #4a90e2;
            padding: 3rem 1.5rem;
            border-radius: 8px;
            background-color: #f9fbfd;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background-color: #edf4fc;
            border-color: #2374d2;
        }
        .drop-zone p {
            margin: 0;
            font-weight: 500;
            color: #4a90e2;
        }
        #fileInput {
            display: none;
        }
        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <h1>Excel to Notepad Documentation</h1>
    <p>Upload your Excel file to generate a beautifully padded, human-readable layout without manual dividers.</p>
    
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>Drag & drop your Excel file here, or click to browse</p>
        <input type="file" id="fileInput" accept=".xlsx, .xls" />
    </div>

    <div id="status" class="status"></div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');

    // Drag and drop event styling listeners
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }, false);
    });

    // Handle dropped file
    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length) handleFile(files[0]);
    });

    // Handle picked file
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
            showStatus("Please upload a valid Excel file (.xlsx or .xls)", "error");
            return;
        }

        showStatus("Processing file...", "");
        const reader = new FileReader();
        
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                // Read the first worksheet
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Parse rows into a 2D Array
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

                if (rawData.length === 0) {
                    showStatus("The spreadsheet appears to be empty.", "error");
                    return;
                }

                // Process data and build padded table layout
                const txtContent = processExcelToText(rawData);
                
                // Trigger auto-download to user's computer
                downloadTxtFile(txtContent, file.name.replace(/\.[^/.]+\$/, "") + "_documented.txt");
                showStatus("Success! Check your Downloads folder.", "success");
            } catch (err) {
                console.error(err);
                showStatus("Error reading Excel data. Ensure file isn't corrupted.", "error");
            }
        };

        reader.readAsArrayBuffer(file);
    }

    function processExcelToText(rawData) {
    const colWidths = [];
    const COLUMN_GAP = 6; // Number of spaces between columns

    // 1. Filter out completely empty trailing rows
    const activeRows = rawData.filter(row => row && row.some(cell => String(cell).trim() !== ""));

    if (activeRows.length === 0) return "";

    // 2. Calculate the maximum character width for every column dynamically
    activeRows.forEach(row => {
        row.forEach((cell, colIndex) => {
            const cellString = String(cell !== undefined && cell !== null ? cell : "").trim();
            if (!colWidths[colIndex] || cellString.length > colWidths[colIndex]) {
                colWidths[colIndex] = cellString.length;
            }
        });
    });

    const formattedLines = [];

    // 3. Generate beautifully aligned space-separated rows
    activeRows.forEach((row, rowIndex) => {
        const paddedCells = colWidths.map((width, colIndex) => {
            const cellValue = String(row[colIndex] !== undefined && row[colIndex] !== null ? row[colIndex] : "").trim();
            // Pads right with trailing spaces to match the column max length
            return cellValue.padEnd(width, " "); 
        });

        // Join cells using our designated spacing gap
        const rowString = paddedCells.join(" ".repeat(COLUMN_GAP)).trimEnd();
        formattedLines.push(rowString);

        // 4. Generate the dynamic horizontal divider line under the headers (Row 0)
        if (rowIndex === 0) {
            const totalWidth = colWidths.reduce((sum, w) => sum + w, 0) + (COLUMN_GAP * (colWidths.length - 1));
            const dividerString = "-".repeat(totalWidth);
            formattedLines.push(dividerString);
        }
    });

    return formattedLines.join('\n');
}

    function downloadTxtFile(text, filename) {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
        const link = document.createElement("a");
        
        if (navigator.msSaveBlob) { // For older IE support
            navigator.msSaveBlob(blob, filename);
        } else {
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }

    function showStatus(msg, type) {
        statusDiv.innerText = msg;
        statusDiv.className = "status " + type;
    }
</script>

</body>
</html>
